# AWS Load Balancer Controller(ALB) 기준 Ingress.
# 도메인·인증서 ARN은 배포 시 치환.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arco-hr
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: <ACM_CERT_ARN>
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
spec:
  rules:
    - host: <RECRUIT_DOMAIN> # 예: careers.arco.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: arco-hr
                port: { number: 80 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: arco-hr-config
data:
  supabaseUrl: "https://<PROJECT>.supabase.co"
  supabaseAnonKey: "<ANON_KEY>"
# Secret은 kubectl create secret 또는 External Secrets로 별도 주입:
#   kubectl create secret generic arco-hr-secret \
#     --from-literal=supabaseServiceRole=<SERVICE_ROLE_KEY>
